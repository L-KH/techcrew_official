<style>
  :root{

  /* Arabic typography — Cairo (modern, balanced) with Tajawal fallback */
  html[lang="ar"] body,
  html[dir="rtl"] body { font-family: 'Cairo', 'Tajawal', 'Inter', system-ui, sans-serif; }
  html[lang="ar"] .font-display,
  html[dir="rtl"] .font-display { font-family: 'Cairo', 'Tajawal', system-ui, sans-serif; letter-spacing: 0; font-weight: 800; }
  /* preserve LTR for proper-noun runs inside Arabic prose */
  .ltr-keep { unicode-bidi: isolate; direction: ltr; display: inline-block; }
  .theme-transition, .theme-transition *{
    transition: background-color 600ms ease-in-out, color 600ms ease-in-out, border-color 600ms ease-in-out, fill 600ms ease-in-out, stroke 600ms ease-in-out, box-shadow 600ms ease-in-out;
  }
  /* don't transition the moving underline — it has its own transform transition */
  .nav-underline{ transition: transform 500ms cubic-bezier(.4,0,.2,1), width 500ms cubic-bezier(.4,0,.2,1), background-color 500ms ease; }

  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
  .season-anim > * { animation: fadeUp 600ms cubic-bezier(.4,0,.2,1) both; }
  .season-anim > *:nth-child(1){ animation-delay: 0ms; }
  .season-anim > *:nth-child(2){ animation-delay: 80ms; }
  .season-anim > *:nth-child(3){ animation-delay: 160ms; }
  .season-anim > *:nth-child(4){ animation-delay: 240ms; }
  .season-anim > *:nth-child(5){ animation-delay: 320ms; }
  .season-anim > *:nth-child(6){ animation-delay: 400ms; }
  .season-anim > *:nth-child(7){ animation-delay: 480ms; }

  /* ripple */
  @keyframes rippleExpand {
    from { transform: scale(0); opacity: .55; }
    to   { transform: scale(420); opacity: 0; }
  }
  .ripple{
    position: fixed; pointer-events: none; z-index: 60;
    width: 10px; height: 10px; border-radius: 9999px;
    animation: rippleExpand 800ms cubic-bezier(.4,0,.2,1) forwards;
    will-change: transform, opacity;
  }

  /* lightbox */
  @keyframes lbFade { from{opacity:0} to{opacity:1} }
  .lb-backdrop{ animation: lbFade 200ms ease-out both; }

  .grid-bg{
    background-image:
      linear-gradient(to right, color-mix(in oklab, var(--ink) 8%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in oklab, var(--ink) 8%, transparent) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .scribble-underline{
    background-image: linear-gradient(transparent 60%, color-mix(in oklab, var(--primary) 60%, transparent) 60%);
    background-repeat:no-repeat;
    background-size: 100% 100%;
  }
  .sponsor-logo{ filter: grayscale(1) contrast(.9); opacity:.7; transition: filter .35s, opacity .35s, transform .35s, box-shadow .35s;}
  .sponsor-logo:hover{ filter: none; opacity:1; transform: translateY(-3px); }
  .nav-scroll::-webkit-scrollbar{ height:0; }

  .member-card .bio{ opacity:0; transform: translateY(6px); transition: opacity .25s, transform .25s; pointer-events:none; }
  .member-card:hover .bio{ opacity:1; transform:none; }

  /* brilliant trophy sparkles */
  @keyframes sparklePulse {
    0%, 100% { opacity: 0;    transform: scale(0.4) rotate(0deg); }
    50%      { opacity: 1;    transform: scale(1.2) rotate(20deg); }
  }
  .sparkle {
    position: absolute;
    color: #FFE992;
    font-size: 10px;
    line-height: 1;
    pointer-events: none;
    text-shadow: 0 0 6px rgba(255,228,120,0.95), 0 0 12px rgba(255,228,120,0.55);
    animation: sparklePulse 2.4s ease-in-out infinite;
  }

  /* logo hover — bouncy pop + slight tilt + pulsing season-colored glow */
  .logo-anim{ transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; will-change: transform; }
  .logo-anim:hover{ transform: scale(1.08) rotate(-3deg); animation: logoGlow 1.3s ease-in-out infinite; }
  @keyframes logoGlow{
    0%,100%{ box-shadow: 0 0 0 2px var(--ink), 0 0 8px 1px color-mix(in oklab, var(--primary) 55%, transparent); }
    50%    { box-shadow: 0 0 0 2px var(--ink), 0 0 22px 6px color-mix(in oklab, var(--primary) 92%, transparent); }
  }

  /* seamless scrolling ticker — two identical halves, translate by -50%.
     Forced LTR so it loops continuously even on the RTL (Arabic) page. */
  .marquee-track{ display:flex; direction:ltr; width:max-content; will-change: transform; animation: marquee 28s linear infinite; }
  .marquee-track:hover{ animation-play-state: paused; }
  .marquee-group{ display:flex; align-items:center; flex:0 0 auto; }
  .marquee-group > span{ flex:0 0 auto; }
  @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-50%,0,0); } }
  @media (prefers-reduced-motion: reduce){ .marquee-track{ animation: none; } }

  /* audio player equalizer bars */
  .eq{ display:inline-flex; align-items:flex-end; gap:3px; height:20px; }
  .eq i{ width:3px; height:30%; background: currentColor; border-radius:3px; transform-origin:bottom; }
  .eq.playing i{ animation: eqBar .9s ease-in-out infinite; }
  .eq i:nth-child(1){ animation-delay:0s }
  .eq i:nth-child(2){ animation-delay:.18s }
  .eq i:nth-child(3){ animation-delay:.36s }
  .eq i:nth-child(4){ animation-delay:.54s }
  .eq i:nth-child(5){ animation-delay:.12s }
  @keyframes eqBar { 0%,100%{ height:25%; } 50%{ height:100%; } }
  /* soft pulsing ring around the play button while playing */
  @keyframes playPulse { 0%{ box-shadow:0 0 0 0 var(--pulse); } 70%{ box-shadow:0 0 0 12px transparent; } 100%{ box-shadow:0 0 0 0 transparent; } }
  .playing-pulse{ animation: playPulse 1.8s ease-out infinite; }
  @media (prefers-reduced-motion: reduce){ .eq.playing i, .playing-pulse{ animation:none; } }

  /* hero slideshow cross-fade — backdrop fills, foreground stays uncropped */
  .slide{ position: absolute; inset: 0; transition: opacity 1200ms cubic-bezier(.4,0,.2,1); }
  .slide-backdrop{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.15); filter: blur(28px) brightness(0.85); }
  .slide-main    { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

/* Inline SVG placeholder used when an image file doesn't exist yet */
function PlaceholderSVG({ w, h, label, theme }){
  const id = `p-${Math.random().toString(36).slice(2,8)}`;
  const stripeA = theme.primary;
  const stripeB = `color-mix(in oklab, ${theme.primary} 35%, white)`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid slice" className="w-full h-full block">
      <defs>
        <pattern id={id} width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="24" height="24" fill={stripeA}/>
          <rect width="12" height="24" fill={stripeB}/>
        </pattern>
      </defs>
      <rect width={w} height={h} fill={`url(#${id})`} />
      <rect width={w} height={h} fill={theme.ink} opacity=".08"/>
      <g>
        <rect x="16" y={h-44} width={label.length * 8 + 24} height="28" fill={theme.ink} rx="6"/>
        <text x="28" y={h-25} fontFamily="ui-monospace, Menlo, monospace" fontSize="13" fill={theme.panel} letterSpacing=".06em">
          {label}
        </text>
      </g>
    </svg>
  );
}

/* Map a full image path to its lightweight display thumbnail
   (e.g. ".../main1.webp" -> ".../main1-thumb.webp"). The page loads the thumb;
   the lightbox loads the original full-res file on click. */
function thumbSrc(src){
  if (!src) return src;
  return src.replace(/\.(webp|jpe?g|png)$/i, "-thumb.webp");
}

/* SmartImg — tries the given path first, falls back to a themed placeholder.
   The moment the coach drops a real file at the expected path, it shows up. */
function SmartImg({ src, w, h, label, theme, onClick, alt }){
  const [failed, setFailed] = useState(false);
  useEffect(() => { setFailed(false); }, [src]);
  if (!src || failed) {
    return (
      <div className={onClick ? "cursor-pointer w-full h-full" : "w-full h-full"} onClick={onClick}>
        <PlaceholderSVG w={w} h={h} label={label} theme={theme}/>
      </div>
    );
  }
  return (
    <img
      src={src}
      alt={alt || label}
      className="w-full h-full object-cover block"
      style={{ cursor: onClick ? "zoom-in" : "default" }}
      onError={() => setFailed(true)}
      onClick={onClick}
    />
  );
}

/* SmartMedia — renders an image, or a hover-to-play muted-loop video.
   Images display a lightweight thumbnail; falling back to the full file, then a
   themed placeholder if neither exists. Lightbox always gets the full original. */
function SmartMedia({ item, w, h, theme, onClick }){
  const [failed, setFailed] = useState(false);
  // for images: start at the thumb, drop to full on first error, placeholder on second
  const [imgSrc, setImgSrc] = useState(() => item && item.src ? thumbSrc(item.src) : null);
  const videoRef = useRef(null);
  useEffect(() => {
    setFailed(false);
    setImgSrc(item && item.src ? thumbSrc(item.src) : null);
  }, [item && item.src]);

  if (!item || !item.src || failed) {
    return (
      <div className={onClick ? "cursor-pointer w-full h-full" : "w-full h-full"} onClick={onClick}>
        <PlaceholderSVG w={w} h={h} label={(item && item.label) || ""} theme={theme}/>
      </div>
    );
  }

  if (item.type === "video") {
    const playFromStart = () => {
      const v = videoRef.current;
      if (!v) return;
      try { v.currentTime = 0; } catch (e) {}
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    };
    const pauseAndReset = () => {
      const v = videoRef.current;
      if (!v) return;
      v.pause();
      try { v.currentTime = 0; } catch (e) {}
    };
    return (
      <video
        ref={videoRef}
        src={item.src}
        poster={item.poster}
        muted loop playsInline
        preload="metadata"
        className="w-full h-full object-cover block"
        style={{ cursor: onClick ? "zoom-in" : "default" }}
        onError={() => setFailed(true)}
        onClick={onClick}
        onMouseEnter={playFromStart}
        onMouseLeave={pauseAndReset}
        aria-label={item.label}
      />
    );
  }

  return (
    <img
      src={imgSrc}
      alt={item.label}
      loading="lazy"
      className="w-full h-full object-cover block"
      style={{ cursor: onClick ? "zoom-in" : "default" }}
      onError={() => {
        if (imgSrc !== item.src) setImgSrc(item.src); // thumb missing → try full file
        else setFailed(true);                          // full missing → placeholder
      }}
      onClick={onClick}
    />
  );
}

/* ================================================================== */
/*  HeroSlideshow — cross-fades through multiple frames on a timer.     */
/* ================================================================== */
function HeroSlideshow({ frames, interval=7000, theme, onClick }){
  const [idx, setIdx] = useState(0);
  const [errored, setErrored] = useState({});
  const [useFull, setUseFull] = useState({}); // per-frame: thumb failed → load full file
  useEffect(() => { setIdx(0); }, [frames]);
  useEffect(() => {
    if (!frames || frames.length <= 1) return;
    const id = setInterval(() => setIdx(i => (i + 1) % frames.length), interval);
    return () => clearInterval(id);
  }, [frames, interval]);

  const handleClick = () => {
    if (onClick && frames[idx]) onClick({ type: "image", ...frames[idx] });
  };

  return (
    <div className="relative w-full h-full overflow-hidden" onClick={handleClick}
         style={{ cursor: onClick ? "zoom-in" : "default", background: theme.ink }}>
      {frames.map((frame, i) => {
        const shown = useFull[i] ? frame.src : thumbSrc(frame.src);
        return (
          <div
            key={i}
            className="slide"
            style={{ opacity: idx === i && !errored[i] ? 1 : 0 }}
          >
            {/* blurred backdrop fills the box edge-to-edge */}
            <img src={shown} alt="" aria-hidden className="slide-backdrop"/>
            {/* uncropped photo on top */}
            <img
              src={shown}
              alt={frame.label || ""}
              loading={i === 0 ? "eager" : "lazy"}
              className="slide-main"
              onError={() => {
                if (!useFull[i]) setUseFull(prev => ({ ...prev, [i]: true })); // thumb missing → full
                else setErrored(prev => ({ ...prev, [i]: true }));             // full missing → hide
              }}
            />
          </div>
        );
      })}
      {/* dot indicators */}
      <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2 z-10">
        {frames.map((_, i) => (
          <button
            key={i}
            onClick={(e) => { e.stopPropagation(); setIdx(i); }}
            className="rounded-full border-2 transition-all duration-300"
            style={{
              width: idx === i ? 26 : 10,
              height: 10,
              background: idx === i ? theme.primary : "rgba(255,255,255,0.7)",
              borderColor: theme.ink,
              boxShadow: idx === i ? `2px 2px 0 ${theme.ink}` : "none",
            }}
            aria-label={`Slide ${i+1}`}
          />
        ))}
      </div>
    </div>
  );
}

/* ================================================================== */
/*  Navbar with sliding underline                                      */
/* ================================================================== */
function Navbar({ active, onChange, theme, lang, setLang, t, view, onHome, onMessage }){
  const navRef = useRef(null);
  const btnRefs = useRef({});
  const [indicator, setIndicator] = useState({ x: 0, w: 0, visible: false });
  const onMsgPage = view === "message";

  useLayoutEffect(() => {
    const measure = () => {
      const btn = btnRefs.current[active.id];
      if (btn) setIndicator({ x: btn.offsetLeft, w: btn.offsetWidth, visible: true });
    };
    measure();
    // re-measure after fonts settle and on resize so it stays aligned (LTR + RTL)
    const id = window.setTimeout(measure, 120);
    window.addEventListener("resize", measure);
    return () => { window.clearTimeout(id); window.removeEventListener("resize", measure); };
  }, [active.id, lang, view]);

  return (
    <header
      className="sticky top-0 z-40 w-full backdrop-blur-md border-b"
      style={{
        background: `color-mix(in oklab, ${theme.panel} 88%, transparent)`,
        borderColor: `color-mix(in oklab, ${theme.ink} 12%, transparent)`,
      }}
    >
      <div className="max-w-7xl mx-auto px-3 md:px-5 h-[82px] flex items-center justify-between gap-2 md:gap-4">
        <a href="#top" onClick={(e) => { e.preventDefault(); onHome(); }} className="flex items-center gap-3 shrink-0 cursor-pointer">
          <Logo theme={theme} size={54}/>
          <div className="hidden lg:block leading-tight">
            <div className="font-display font-bold text-lg" style={{ color: theme.ink }}>Tech Crew</div>
            <div className="text-[11px] uppercase tracking-[0.18em]" style={{ color: theme.ink, opacity: .6 }}>
              {t.teamSub}
            </div>
          </div>
        </a>

        <div className="flex items-center gap-2 md:gap-3">
          <button
            onClick={onMessage}
            className="inline-flex items-center px-3 lg:px-4 py-2 rounded-full text-[12px] lg:text-[13px] font-semibold uppercase tracking-wider whitespace-nowrap border-2 shrink-0"
            style={{
              background: onMsgPage ? theme.primary : "transparent",
              color: theme.ink,
              borderColor: onMsgPage ? theme.ink : `color-mix(in oklab, ${theme.ink} 18%, transparent)`,
              boxShadow: onMsgPage ? `3px 3px 0 ${theme.ink}` : "none",
              transform: onMsgPage ? "translate(-1.5px,-1.5px)" : "none",
            }}
          >
            {t.navMessage}
          </button>
          <nav
            ref={navRef}
            className="relative flex items-center gap-1.5 overflow-x-auto md:overflow-visible nav-scroll py-2"
            aria-label="Season selector"
          >
            {SEASONS.map((s) => {
              const isActive = s.id === active.id;
              return (
                <button
                  key={s.id}
                  ref={el => { if (el) btnRefs.current[s.id] = el; }}
                  onClick={(e) => onChange(s, e)}
                  className="relative px-3 md:px-4 py-2 rounded-full text-[12px] md:text-[13px] font-semibold uppercase tracking-wider whitespace-nowrap border-2"
                  style={{
                    background: isActive ? s.theme.primary : "transparent",
                    color: isActive ? s.theme.ink : theme.ink,
                    borderColor: isActive ? s.theme.ink : `color-mix(in oklab, ${theme.ink} 18%, transparent)`,
                    boxShadow: isActive ? `3px 3px 0 ${s.theme.ink}` : "none",
                    transform: isActive ? "translate(-1.5px,-1.5px)" : "none",
                  }}
                >
                  <span className="hidden md:inline">{s.name}</span>
                  <span className="md:hidden">{s.name.slice(0,4)}</span>
                  <span className="ml-2 opacity-60 text-[10px] hidden lg:inline">{s.years}</span>
                </button>
              );
            })}
            {indicator.visible && (
              <span
                aria-hidden
                className="nav-underline absolute bottom-1 h-1 rounded-full pointer-events-none"
                style={{
                  left: 0,
                  right: "auto",
                  width: indicator.w,
                  transform: `translateX(${indicator.x}px)`,
                  background: theme.secondary,
                }}
              />
            )}
          </nav>

          <div
            className="flex shrink-0 rounded-full border-2 p-0.5"
            style={{ borderColor: theme.ink, background: theme.panel }}
            role="group"
            aria-label="Language"
          >
            {["ar","fr"].map(l => (
              <button
                key={l}
                onClick={() => setLang(l)}
                className="px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider"
                style={{
                  background: lang===l ? theme.ink : "transparent",
                  color:      lang===l ? theme.panel : theme.ink,
                }}
              >
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>
    </header>
  );
}

/* ================================================================== */
/*  Anthem (شارة الموسم) — streaming mp3 player per song                 */
/* ================================================================== */
function fmtTime(s){
  if (!s || isNaN(s)) return "0:00";
  const m = Math.floor(s / 60), x = Math.floor(s % 60);
  return m + ":" + String(x).padStart(2, "0");
}

function AudioPlayer({ track, index, theme, t }){
  const ref = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [cur, setCur] = useState(0);
  const [dur, setDur] = useState(0);
  const [loading, setLoading] = useState(false);

  const toggle = () => {
    const a = ref.current; if (!a) return;
    if (a.paused) {
      document.querySelectorAll("audio").forEach(o => { if (o !== a) o.pause(); }); // solo
      setLoading(true);
      const p = a.play();
      if (p && p.catch) p.catch(() => setLoading(false));
    } else {
      a.pause();
    }
  };

  const seek = (e) => {
    const a = ref.current; if (!a || !dur) return;
    const r = e.currentTarget.getBoundingClientRect();
    let ratio = (e.clientX - r.left) / r.width;     // track is forced LTR below
    ratio = Math.min(1, Math.max(0, ratio));
    a.currentTime = ratio * dur;
    setCur(a.currentTime);
  };

  return (
    <div className="rounded-2xl border-2 p-4 sm:p-5 flex items-center gap-4"
         style={{ borderColor: theme.ink, background: "white", boxShadow: `6px 6px 0 ${theme.ink}` }}>
      <audio
        ref={ref}
        src={track.src}
        preload="none"
        onPlay={() => { setPlaying(true); setLoading(false); }}
        onPause={() => setPlaying(false)}
        onWaiting={() => setLoading(true)}
        onPlaying={() => setLoading(false)}
        onTimeUpdate={() => ref.current && setCur(ref.current.currentTime)}
        onLoadedMetadata={() => ref.current && setDur(ref.current.duration)}
        onEnded={() => setPlaying(false)}
      />

      {/* play / pause */}
      <button
        onClick={toggle}
        aria-label={playing ? "pause" : "play"}
        className={"w-14 h-14 rounded-full grid place-items-center border-2 shrink-0 transition-transform hover:scale-105 " + (playing ? "playing-pulse" : "")}
        style={{ background: theme.primary, borderColor: theme.ink, color: theme.ink,
                 boxShadow: `3px 3px 0 ${theme.ink}`, "--pulse": `color-mix(in oklab, ${theme.primary} 70%, transparent)` }}
      >
        {loading ? (
          <svg viewBox="0 0 24 24" width="22" height="22" className="animate-spin" fill="none" stroke={theme.ink} strokeWidth="2.5" strokeLinecap="round">
            <path d="M21 12a9 9 0 1 1-6.2-8.6"/>
          </svg>
        ) : playing ? (
          <svg viewBox="0 0 24 24" width="22" height="22" fill={theme.ink} aria-hidden><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        ) : (
          <svg viewBox="0 0 24 24" width="22" height="22" fill={theme.ink} aria-hidden><path d="M8 5v14l11-7z"/></svg>
        )}
      </button>

      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 mb-2">
          <span className={"eq " + (playing ? "playing" : "")} style={{ color: theme.secondary }}>
            <i/><i/><i/><i/><i/>
          </span>
          <span className="font-display font-bold text-sm truncate" style={{ color: theme.ink }}>
            {t.anthemTrack} {index + 1}
          </span>
        </div>

        {/* progress (forced LTR so the fill + seek math read the same in RTL) */}
        <div onClick={seek} dir="ltr"
             className="h-2.5 rounded-full cursor-pointer relative overflow-hidden"
             style={{ background: `color-mix(in oklab, ${theme.ink} 14%, white)` }}>
          <div className="h-full rounded-full" style={{ width: dur ? (cur / dur * 100) + "%" : "0%", background: theme.primary }}/>
        </div>
        <div dir="ltr" className="flex justify-between text-[11px] mt-1 font-mono" style={{ color: theme.ink, opacity: .6 }}>
          <span>{fmtTime(cur)}</span><span>{fmtTime(dur)}</span>
        </div>
      </div>
    </div>
  );
}

                  <MailIcon color={onSecondary}/> {c.email}
                </a>
              </div>
            ))}
          </div>

          <div className="mt-7 flex gap-3">
            <a href="https://www.facebook.com/profile.php?id=61573513858627" target="_blank" rel="noreferrer noopener" aria-label="Facebook"
               className="w-10 h-10 grid place-items-center rounded-full border-2 transition-transform hover:-translate-y-0.5"
               style={{ borderColor: onSecondary, background: "rgba(255,255,255,0.08)" }}>
              <FacebookIcon color={onSecondary}/>
            </a>
            <a href="https://www.instagram.com/techcrew4/" target="_blank" rel="noreferrer noopener" aria-label="Instagram"
               className="w-10 h-10 grid place-items-center rounded-full border-2 transition-transform hover:-translate-y-0.5"
               style={{ borderColor: onSecondary, background: "rgba(255,255,255,0.08)" }}>
              <InstagramIcon color={onSecondary}/>
            </a>
          </div>
        </div>
      </div>

      <div className="mt-12 pt-6 max-w-7xl mx-auto px-5 md:px-8 flex items-center justify-between flex-wrap gap-3 text-xs"
           style={{ borderTop: `1px solid ${muted}`, color: muted }}>
        <div className="flex items-center gap-3">
          <Logo theme={theme} size={36}/>
          <span>© 2026 Tech Crew · FLL C-325 · {t.footerBuilt}</span>
        </div>
        <div>{t.footerViewing} <span style={{ color: onSecondary, fontWeight: 700 }}>{season.name}</span> · {season.years}</div>
      </div>
    </footer>
  );
}

/* ================================================================== */
/*  Lightbox                                                           */
/* ================================================================== */
function Lightbox({ data, onClose, theme }){
  // start from the (already-cached) thumbnail for an instant open, then upgrade
  // to the full-res original once it finishes downloading.
  const [hiRes, setHiRes] = useState(false);
  useEffect(() => {
    if (!data) return;
    setHiRes(false);
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
  }, [data, onClose]);

  if (!data) return null;

  const isVideo = data.type === "video";
  const imgSrc = isVideo ? null : (hiRes ? data.src : thumbSrc(data.src));

  return (
    <div
      className="lb-backdrop fixed inset-0 z-[70] grid place-items-center p-6"
      style={{ background: "rgba(0,0,0,0.85)" }}
      onClick={onClose}
    >
      <div className="relative max-w-5xl w-full" onClick={(e) => e.stopPropagation()}>
        <button
          onClick={onClose}
          className="absolute -top-4 -right-4 w-10 h-10 rounded-full border-2 grid place-items-center font-bold text-lg z-10"
          style={{ background: theme.primary, color: theme.ink, borderColor: theme.ink, boxShadow: `4px 4px 0 ${theme.ink}` }}
          aria-label="Close"
        >×</button>
        <div className="rounded-2xl overflow-hidden border-2 bg-black grid place-items-center"
             style={{ borderColor: theme.ink, boxShadow: `10px 10px 0 ${theme.ink}`, maxHeight: "78vh" }}>
          {isVideo ? (
            <video
              src={data.src}
              poster={data.poster}
              controls
              autoPlay
              playsInline
              className="block w-full h-auto max-h-[78vh]"
            />
          ) : (
            <>
              {/* hidden full-res loader: when ready, swap the visible img to it */}
              <img src={data.src} alt="" aria-hidden style={{ display: "none" }}
                   onLoad={() => setHiRes(true)} onError={() => setHiRes(true)}/>
              <img
                src={imgSrc}
                alt={data.label}
                className="block w-full h-auto max-h-[78vh] object-contain transition-[filter] duration-300"
                style={{ filter: hiRes ? "none" : "blur(0.5px)" }}
              />
            </>
          )}
        </div>
        <div className="mt-3 text-center font-mono text-xs" style={{ color: "white" }}>{data.label}</div>
      </div>
    </div>
  );
}

/* ================================================================== */
/*  App                                                                */
/* ================================================================== */
function App(){
  const [active, setActive] = useState(SEASONS[3]); // default UNEARTHED (current season)
  const [lang, setLang] = useState("ar");
  const [view, setView] = useState("home"); // "home" | "message"
  const [animKey, setAnimKey] = useState(0);
  const [ripple, setRipple] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const theme = active.theme;
  const t = I18N[lang];

  const goHome = () => { setView("home"); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const goMessage = () => { setView("message"); window.scrollTo({ top: 0 }); };
  const goSponsors = () => {
    setView("home");
    setTimeout(() => {
      const el = document.getElementById("sponsors");
      if (el) el.scrollIntoView({ behavior: "smooth" });
    }, 60);
  };

  // CSS variables
  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty("--primary",   theme.primary);
    r.setProperty("--secondary", theme.secondary);
    r.setProperty("--accent",    theme.accent);
    r.setProperty("--ink",       theme.ink);
    r.setProperty("--panel",     theme.panel);
  }, [theme]);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
  }, [lang]);

  // Dynamic browser tab title
  useEffect(() => {
    document.title = `Tech Crew | ${active.name}`;
  }, [active]);

  // Dynamic favicon tint
  useEffect(() => {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='${encodeURIComponent(theme.primary)}'/><circle cx='32' cy='32' r='14' fill='${encodeURIComponent(theme.ink)}'/></svg>`;
    const link = document.getElementById("favicon");
    if (link) link.href = `data:image/svg+xml;utf8,${svg}`;
  }, [theme]);

  const handleChange = (s, e) => {
    const switchingView = view !== "home";
    setView("home");
    if (s.id === active.id && !switchingView) return;
    if (e && e.currentTarget) {
      const r = e.currentTarget.getBoundingClientRect();
      setRipple({
        x: r.left + r.width/2,
        y: r.top + r.height/2,
        color: s.theme.primary,
        key: Date.now(),
      });
      window.setTimeout(() => setRipple(null), 850);
    }
    setActive(s);
    setAnimKey((k) => k + 1);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <div id="top" className="theme-transition min-h-screen" style={{ background: theme.panel }}>
      <Navbar active={active} onChange={handleChange} theme={theme} lang={lang} setLang={setLang} t={t}
              view={view} onHome={goHome} onMessage={goMessage}/>

      {view === "message" ? (
        <VideoBanner key={"msg:" + lang} theme={theme} t={t} lang={lang} onSponsors={goSponsors}/>
      ) : (
        <>
          <main key={animKey + ":" + lang} className="season-anim">
            <Hero season={active} theme={theme} t={t} lang={lang} onImageClick={(item) => setLightbox(item)}/>
            <About theme={theme} t={t} lang={lang}/>
            <Achievements season={active} theme={theme} t={t} lang={lang}/>
            <Robot   season={active} theme={theme} t={t} lang={lang} onImageClick={(item) => setLightbox(item)}/>
            <Project season={active} theme={theme} t={t} lang={lang} onImageClick={(item) => setLightbox(item)}/>
            <Team    season={active} theme={theme} t={t} lang={lang}/>
            <Anthem  season={active} theme={theme} t={t} lang={lang}/>
            <Sponsors season={active} theme={theme} t={t} lang={lang}/>
          </main>
          <Footer season={active} theme={theme} t={t} lang={lang}/>
        </>
      )}

      {ripple && (
        <div
          key={ripple.key}
          className="ripple"
          style={{
            left: ripple.x - 5,
            top:  ripple.y - 5,
            background: ripple.color,
          }}
        />
      )}

      <Lightbox data={lightbox} onClose={() => setLightbox(null)} theme={theme}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
